x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vibe-match
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: docker.io/bitnamilegacy/moodle:4.3
    depends_on:
      mariadb:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: moodleuser
      MOODLE_DATABASE_PASSWORD: moodlepass
      MOODLE_DATABASE_NAME: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin@123
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: My Moodle
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_moodledata:/bitnami/moodledata
    ports:
      - '8888:8080'
      - '8443:443'

  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./src/modules/judge0/judge0-v1.13.1/judge0.conf:/judge0.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '2358:2358'
    privileged: true
    <<: *default-logging
    depends_on:
      - postgres
      - redis
    restart: always

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ['./scripts/workers']
    volumes:
      - ./src/modules/judge0/judge0-v1.13.1/judge0.conf:/judge0.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    privileged: true
    <<: *default-logging
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  mariadb_data:
  moodle_data:
  moodle_moodledata:
  postgres_data:
  redis_data:
